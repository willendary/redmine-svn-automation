<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs - Sky Redmine</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261111-3">
<meta name="theme-color" content="#4263eb">
<link rel="stylesheet" href="/tailwind.css?v=20261111-3">
<link rel="stylesheet" href="/interface.css?v=20261111-3">
<script src="/interface.js?v=20261111-3"></script>
</head>
<body class="page-logs">
<div class="pagina">
    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>

    <div class="topo">
        <div>
            <h1>Logs do sistema</h1>
            <p class="subtitulo">Acompanhe as operações e encontre rapidamente o que precisa investigar.</p>
        </div>
        <div class="acoes-topo">
            <button class="btn secundario" id="atualizar" data-icon="refresh">Atualizar</button>
            <button class="btn perigo" id="limpar" data-icon="trash">Limpar logs</button>
        </div>
    </div>

    <section class="card logs-card"><div class="logs-toolbar"><div class="search-field"><span data-icon-only="search"></span><input type="search" id="filtro-logs" placeholder="Buscar nos logs..." aria-label="Buscar nos logs"></div><span class="log-count" id="log-count">Carregando...</span><label class="check"><input type="checkbox" id="logs-auto" checked>Atualizar automaticamente</label></div><div class="terminal-label"><span class="terminal-dots" aria-hidden="true"><i></i><i></i><i></i></span>sky / atividade do servidor</div><pre id="logs" tabindex="0" aria-label="Registros do servidor">Carregando registros...</pre><div class="table-footer"><span id="logs-status" role="status">Conectando ao servidor...</span><span>SVN · Redmine · API</span></div></section>
</div>

<script src="/comum.js?v=20261111-3"></script>
<script src="/logs.js?v=20261111-3"></script>
</body>
</html>
